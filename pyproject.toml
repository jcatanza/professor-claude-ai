[project]
name = "professor-claude-ai"
version = "0.1.0"
description = "An autonomous self-teaching AI research agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Joseph Catanzarite" },
]
keywords = ["llm", "agents", "langgraph", "research", "autonomous"]

dependencies = [
    # Core agent framework (versions match Manning AI Agents and Applications, ch11 requirements.txt)
    "langgraph>=1.0.2",
    "langchain>=1.0.3",
    "langchain-anthropic>=0.3",        # Claude API via LangChain
    "langchain-community>=0.4.1",
    "langchain-chroma>=1.0.0",
    "langgraph-supervisor>=0.0.30",    # Supervisor pattern (book ch 12.3)
    "langgraph-checkpoint-sqlite>=2.0", # Persistent checkpointer (book ch 14.1 NOTE)
    # Storage
    "chromadb>=1.3.0",                 # Vector store for paper-text RAG
    "duckdb>=1.0",                     # Episodic event log
    # Ingestion
    "arxiv>=2.1",                      # arXiv API client
    "feedparser>=6.0",                 # Lab blog RSS feeds
    "beautifulsoup4>=4.12",
    "html2text>=2025.4.15",
    # Web/HTTP
    "httpx>=0.27",
    "aiohttp>=3.12",
    # Config and observability
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    # Misc
    "tiktoken>=0.9",
    "lxml>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-beautifulsoup4",
]
local-llm = [
    # For local triage model via Ollama (v0.2+, choice deferred pending Manning SLM book)
    "ollama>=0.3",
]

[project.scripts]
professor = "professor_claude_ai.cli:main"
professor-run = "professor_claude_ai.cli:run_nightly"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/professor_claude_ai"]

# ----- ruff: linter + formatter -----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Sensible defaults; not overly aggressive.
# E/W: pycodestyle, F: pyflakes, I: isort, B: bugbear, UP: pyupgrade,
# SIM: simplify, RUF: ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",  # line too long — formatter handles this
    "B008",  # function call in default argument — common w/ pydantic Field()
]

[tool.ruff.format]
quote-style = "double"

# ----- mypy: type checker -----
[tool.mypy]
python_version = "3.12"
strict = true
# Third-party libs without stubs are common in the LLM ecosystem; allow them.
ignore_missing_imports = true
# Tests can be looser
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ----- pytest -----
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=professor_claude_ai",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "integration: end-to-end tests that hit external services (skip by default in CI)",
    "slow: tests that take >5 seconds",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src/professor_claude_ai"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
