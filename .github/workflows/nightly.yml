name: Nightly Run

on:
  schedule:
    # 06:00 UTC daily ≈ 23:00 PT / 02:00 ET — adjust to your preference
    - cron: "23 6 * * *"
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e .

      # Restore persistent state (checkpoints, you-model, episodic db) from cache
      # so memory survives across runs. This is the simplest path; a proper
      # solution uses an external store (S3, Postgres) — v0.4.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/
          key: professor-data-${{ github.run_id }}
          restore-keys: |
            professor-data-

      - name: Run nightly cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_TRACING: "false"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: |
          source .venv/bin/activate
          professor-run

      - name: Upload digest as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ github.run_id }}
          path: data/digests/

      # Save the data dir so next run can restore it
      - name: Save data cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/
          key: professor-data-${{ github.run_id }}
